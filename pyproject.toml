[project]
name = "sandbox-harness-platform"
version = "0.1.0"
description = "A thin stateful OpenSandbox session broker for Codex, Claude and DeepSeek harnesses"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi==25.1.0",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "redis>=5,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]
runtime-media = [
  "audioop-lts>=0.2,<1; python_version >= '3.13'",
  "av>=14,<17",
  "beautifulsoup4>=4.12,<5",
  "cairosvg>=2.7,<3",
  "ffmpeg-python>=0.2,<1",
  "imagehash>=4.3,<5",
  "imageio>=2.37,<3",
  "imageio-ffmpeg>=0.6,<1",
  "jsonschema>=4.23,<5",
  "librosa>=0.11,<2",
  "matplotlib>=3.10,<4",
  "moviepy>=2.1,<3",
  "mutagen>=1.47,<2",
  "networkx>=3.4,<4",
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.10,<5",
  "onnxruntime>=1.21,<2",
  "piexif>=1.1,<2",
  "pillow>=11,<13",
  "psutil>=6,<8",
  "psd-tools>=1.10,<2",
  "pymupdf>=1.25,<2",
  "pydub>=0.25,<1",
  "PyYAML>=6,<7",
  "rembg[cpu]>=2.0.65,<3",
  "reportlab>=4.3,<5",
  "scikit-image>=0.25,<1",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "soundfile>=0.13,<1",
  "shapely>=2.0,<3",
  "svgwrite>=1.4,<2",
  "sympy>=1.13,<2",
  "trimesh>=4.6,<5",
  "xmltodict>=0.14,<2",
]

[project.scripts]
sandbox-harness-api = "sandbox_harness.main:run"
sandbox-harness-gateway = "sandbox_harness.gateway:run"
sandbox-harness-logs = "sandbox_harness.log_query:main"
sandbox-harness-user = "sandbox_harness.auth_cli:main"
sandbox-harness-runtime = "sandbox_runtime.main:run"
sandbox-background = "sandbox_runtime.background_cli:main"
sandbox-interact = "sandbox_runtime.interaction_cli:main"
sandbox-media = "sandbox_runtime.media_cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_harness", "src/sandbox_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.data/pytest"
cache_dir = ".data/pytest-cache"
