server {
    listen 127.0.0.1:18090 proxy_protocol;
    server_name _;
    client_max_body_size 512m;

    location = / {
        return 302 /sandbox-harness/;
    }

    location = /sandbox-harness {
        return 301 /sandbox-harness/;
    }

    location ^~ /sandbox-harness/ {
        proxy_pass http://127.0.0.1:22766/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Prefix /sandbox-harness;
        proxy_set_header X-Updream-Ingress frpc;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no always;
    }

    location / {
        return 404;
    }
}
